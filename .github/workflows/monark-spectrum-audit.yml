name: Audit MonArk and Spectrum

on:
  push:
    branches:
      - audit/monark-spectrum
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run MonArk and Spectrum repair and validation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          : > reports/monark-spectrum-ci.log
          node scripts/audit-monark-spectrum.mjs | tee -a reports/monark-spectrum-ci.log
          node tests/qa.mjs | tee -a reports/monark-spectrum-ci.log
          node tests/monark-spectrum-qa.mjs | tee -a reports/monark-spectrum-ci.log
          node tests/monark-spectrum-semantic-diff-qa.mjs | tee -a reports/monark-spectrum-ci.log
          node scripts/report-unfinished.mjs | tee -a reports/monark-spectrum-ci.log
          node scripts/report-monark-spectrum-current.mjs | tee -a reports/monark-spectrum-ci.log
          echo "monark_spectrum_audit_status=passed" | tee -a reports/monark-spectrum-ci.log
      - name: Commit verified results
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/boats.js reports/monark-spectrum-current.json reports/monark-spectrum-current.md reports/monark-spectrum-ci.log reports/unfinished-work.json reports/unfinished-work.md
          if ! git diff --cached --quiet; then
            git commit -m "Apply verified MonArk and Spectrum audit corrections"
            git push
          fi
