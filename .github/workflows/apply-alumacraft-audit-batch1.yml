name: Verify Alumacraft app-model audit batch 1

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-alumacraft-audit-batch1.yml
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Run syntax and catalog QA
        run: |
          node --check app.js
          node --check data/boats.js
          node --check data/equipment.js
          node --check data/catalog.js
          node --check tests/qa.mjs
          node tests/qa.mjs
