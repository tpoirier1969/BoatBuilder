name: Audit all manufacturer rosters

on:
  push:
    branches:
      - audit/all-manufacturer-rosters
  workflow_dispatch:

permissions:
  contents: write

jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate catalog roster baseline
        run: node scripts/report-all-manufacturer-roster-baseline.mjs
      - name: Commit baseline reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/all-manufacturer-roster-baseline.json reports/all-manufacturer-roster-baseline.md
          if ! git diff --cached --quiet; then
            git commit -m "Capture all-manufacturer roster baseline"
            git push
          fi
