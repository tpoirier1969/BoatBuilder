name: Migrate catalog to canonical app data

on:
  push:
    branches: [main]
    paths:
      - scripts/migrate-catalog-to-canonical.mjs
      - .github/workflows/migrate-canonical-catalog.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: boatbuilder-canonical-migration
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out main
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Build canonical app data
        run: node scripts/migrate-catalog-to-canonical.mjs

      - name: Normalize generated QA files
        shell: python
        run: |
          from pathlib import Path

          workflow = Path(".github/workflows/qa.yml")
          text = workflow.read_text()
          text = text.replace("actions/checkout@v4", "actions/checkout@v5")
          text = text.replace("actions/setup-node@v4", "actions/setup-node@v5")
          text = text.replace('          package-manager-cache: false\n', '')
          workflow.write_text(text)

          qa = Path("tests/qa.mjs")
          text = qa.read_text()
          text = text.replace(
              'assert.deepEqual(oldAlaskan.valueEras.map(era => era.label), ["2000s"], "Old Alaskan retained unsupported value eras");',
              'assert.equal(oldAlaskan.valueEras.map(era => era.label).join(","), "2000s", "Old Alaskan retained unsupported value eras");'
          )
          qa.write_text(text)

      - name: Remove runtime correction file
        run: git rm data/lund-corrections.js

      - name: Validate migrated application
        run: |
          node --check app.js
          node --check data/boats.js
          node --check data/equipment.js
          node --check data/catalog.js
          node --check tests/qa.mjs
          node tests/qa.mjs

      - name: Commit canonical catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Canonical migration is already applied."
          else
            git commit -m "Move BoatBuilder data into canonical app files"
            git push origin HEAD:main
          fi

# This workflow is temporary and will be removed after the migration commit is verified.
