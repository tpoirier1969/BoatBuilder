name: Parallel Alumacraft 2006-2012 specification extraction

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  ocr-year:
    strategy:
      fail-fast: false
      matrix:
        year: [2006, 2007, 2008, 2009, 2010, 2011, 2012]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - name: Install PDF and OCR tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils tesseract-ocr

      - name: OCR final catalog pages
        shell: bash
        run: |
          set -euo pipefail
          year=${{ matrix.year }}
          yy=${year:2:2}
          if [ "$year" -le 2009 ]; then decade=2000-2009; else decade=2010-2019; fi
          url="https://www.alumacraft.com/original-content/content/dam/global/en/alumacraft/catalogs/${decade}/Catalogs/ALUMA-MY${yy}-Catalog-ENUS.pdf"
          work="/tmp/alumacraft-$year"
          mkdir -p "$work/pages" "$work/ocr" artifact
          pdf="$work/catalog.pdf"
          curl -fL --retry 3 --connect-timeout 25 --max-time 600 -A 'Mozilla/5.0' "$url" -o "$pdf"
          pages=$(pdfinfo "$pdf" | awk '/^Pages:/ {print $2}')
          first=$((pages-11)); if [ "$first" -lt 1 ]; then first=1; fi
          pdftoppm -f "$first" -l "$pages" -jpeg -r 125 -jpegopt quality=74 "$pdf" "$work/pages/page" >/dev/null 2>&1
          find "$work/pages" -name '*.jpg' -print0 | sort -z | xargs -0 -n1 -P6 bash -c '
            img="$1"
            base=$(basename "$img" .jpg)
            out="$(dirname "$(dirname "$img")")/ocr/$base"
            tesseract "$img" "$out" -l eng --psm 6 >/dev/null 2>&1 || true
          ' _
          text="artifact/$year.txt"
          : > "$text"
          page=$first
          for page_txt in $(find "$work/ocr" -name '*.txt' | sort -V); do
            printf '\n===== %s CATALOG PAGE %s =====\n' "$year" "$page" >> "$text"
            cat "$page_txt" >> "$text"
            page=$((page+1))
          done
          bytes=$(stat -c%s "$text")
          dh=$(grep -Eic 'dominator' "$text" || true)
          nh=$(grep -Eic 'navigator' "$text" || true)
          printf 'year\turl\tpages\tfirst_ocr_page\ttext_bytes\tdominator_hits\tnavigator_hits\n%s\t%s\t%s\t%s\t%s\t%s\t%s\n' "$year" "$url" "$pages" "$first" "$bytes" "$dh" "$nh" > "artifact/$year.tsv"

      - uses: actions/upload-artifact@v4
        with:
          name: alumacraft-spec-${{ matrix.year }}
          path: artifact
          retention-days: 1

  merge-evidence:
    needs: ocr-year
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          pattern: alumacraft-spec-*
          path: artifacts
          merge-multiple: true

      - name: Merge compact evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p research/sources
          head -n 1 artifacts/2006.tsv > research/sources/alumacraft-2006-2012-spec-matrix-manifest.tsv
          for year in 2006 2007 2008 2009 2010 2011 2012; do tail -n 1 "artifacts/$year.tsv"; done >> research/sources/alumacraft-2006-2012-spec-matrix-manifest.tsv

          python3 - <<'PY'
          from pathlib import Path
          import re

          lines=[]
          for year in range(2006,2013):
              lines += Path(f'artifacts/{year}.txt').read_text(errors='replace').splitlines()
          year_re=re.compile(r'^===== (20\d\d) CATALOG PAGE (\d+) =====$')
          target_re=re.compile(r'\b(?:DOMINATOR|NAVIGATOR)\b|\b(?:165|175|185)\s+(?:CS\s+)?SPORT\b',re.I)
          out=[
              '# Alumacraft parallel specification-page OCR contexts, 2006-2012','',
              'Official Alumacraft catalog pages. The final twelve pages of each annual scan were OCRed in parallel. OCR is a locator and comparison aid; uncertain characters are not treated as factory facts.',''
          ]
          current_year=current_page=None
          hits=[]
          for i,line in enumerate(lines):
              m=year_re.match(line)
              if m: current_year,current_page=int(m.group(1)),int(m.group(2))
              if target_re.search(line): hits.append((i,current_year,current_page))
          spans=[]
          for i,year,page in hits:
              a,b=max(0,i-18),min(len(lines),i+45)
              if spans and year==spans[-1][2] and a<=spans[-1][1]+8:
                  spans[-1]=(spans[-1][0],max(spans[-1][1],b),year,spans[-1][3])
              else: spans.append((a,b,year,page))
          for n,(a,b,year,page) in enumerate(spans,1):
              out += [f'## {year} context {n} near catalog page {page}','','```text',*lines[a:b],'```','']
          if not spans: out += ['No target-family text survived OCR.','']
          Path('research/sources/alumacraft-2006-2012-spec-matrix-contexts.md').write_text('\n'.join(out)+'\n')
          PY

      - name: Commit evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/sources/alumacraft-2006-2012-spec-matrix-manifest.tsv research/sources/alumacraft-2006-2012-spec-matrix-contexts.md
          git commit -m 'Extract parallel Alumacraft specification evidence'
          git pull --rebase origin main
          git push
