name: Audit G3

on:
  push:
    branches:
      - audit/g3
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate G3 snapshot
        run: node scripts/report-g3-current.mjs
      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/g3-current.json reports/g3-current.md
          if ! git diff --cached --quiet; then
            git commit -m "Capture G3 audit snapshot"
            git push
          fi
