name: Render Alumacraft Dominator and Navigator pages

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  render:
    strategy:
      fail-fast: false
      matrix:
        include:
          - year: 2006
            pages: "13 15 19 21"
          - year: 2007
            pages: "13 15 18"
          - year: 2008
            pages: "12 13 15 17"
          - year: 2009
            pages: "8 9 11 13"
          - year: 2010
            pages: "12 13 19 20"
          - year: 2011
            pages: "5 6 7 8 9"
          - year: 2012
            pages: "5 6 7 8"
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - name: Install PDF renderer
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Render model and specification pages
        shell: bash
        run: |
          set -euo pipefail
          year=${{ matrix.year }}
          yy=${year:2:2}
          if [ "$year" -le 2009 ]; then decade=2000-2009; else decade=2010-2019; fi
          url="https://www.alumacraft.com/original-content/content/dam/global/en/alumacraft/catalogs/${decade}/Catalogs/ALUMA-MY${yy}-Catalog-ENUS.pdf"
          work="/tmp/alumacraft-$year"
          mkdir -p "$work" artifact
          pdf="$work/catalog.pdf"
          curl -fL --retry 3 --connect-timeout 25 --max-time 120 -A 'Mozilla/5.0' "$url" -o "$pdf"
          for page in ${{ matrix.pages }}; do
            pdftoppm -f "$page" -l "$page" -singlefile -jpeg -scale-to 3000 -jpegopt quality=90 "$pdf" "artifact/alumacraft-$year-page-$page" >/dev/null 2>&1
          done
          printf 'year\turl\tpages_rendered\n%s\t%s\t%s\n' "$year" "$url" "${{ matrix.pages }}" > "artifact/alumacraft-$year-model-pages.tsv"

      - uses: actions/upload-artifact@v4
        with:
          name: alumacraft-model-pages-${{ matrix.year }}
          path: artifact
          retention-days: 1
