name: Audit Ultracraft and Fish-Rite

on:
  push:
    branches:
      - audit/ultracraft
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run Ultracraft and Fish-Rite repair and validation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          : > reports/ultracraft-fishrite-ci.log
          node scripts/audit-ultracraft-fishrite.mjs | tee -a reports/ultracraft-fishrite-ci.log
          node tests/qa.mjs | tee -a reports/ultracraft-fishrite-ci.log
          node tests/ultracraft-fishrite-qa.mjs | tee -a reports/ultracraft-fishrite-ci.log
          node tests/ultracraft-fishrite-semantic-diff-qa.mjs | tee -a reports/ultracraft-fishrite-ci.log
          node scripts/report-unfinished.mjs | tee -a reports/ultracraft-fishrite-ci.log
          node scripts/report-ultracraft-fishrite-current.mjs | tee -a reports/ultracraft-fishrite-ci.log
          echo "ultracraft_fishrite_audit_status=passed" | tee -a reports/ultracraft-fishrite-ci.log
      - name: Commit verified Ultracraft and Fish-Rite results
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/boats.js reports/ultracraft-fishrite-current.json reports/ultracraft-fishrite-current.md reports/ultracraft-fishrite-ci.log reports/unfinished-work.json reports/unfinished-work.md
          if ! git diff --cached --quiet; then
            git commit -m "Apply verified Ultracraft and Fish-Rite audit corrections"
            git push
          fi
