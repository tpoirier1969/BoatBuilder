name: One-time Lund catalog extraction

on:
  push:
    paths:
      - '.github/workflows/lund-source-extract.yml'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install PDF text tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Extract Lund catalog evidence
        run: bash scripts/extract_lund_catalogs.sh
      - name: Commit extracts and remove one-time machinery
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/sources/lund-pdf-text research/sources/lund-catalog-target-extracts-2026-07-28.md
          git rm scripts/extract_lund_catalogs.sh .github/workflows/lund-source-extract.yml
          git commit -m 'Extract Lund factory catalog evidence'
          git push
