name: Apply Lund audit through canonical QA

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/qa.yml
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-lund-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Apply focused Lund app-model audit and run QA
        shell: bash
        run: |
          set +e
          mkdir -p research/audits
          {
            echo '=== APPLY AUDIT ==='
            node scripts/apply_lund_app_model_audit.mjs
            apply_status=$?
            echo "apply_status=$apply_status"
            if [ "$apply_status" -eq 0 ]; then
              echo '=== SYNTAX AND QA ==='
              node --check app.js && \
              node --check data/boats.js && \
              node --check data/equipment.js && \
              node --check data/catalog.js && \
              node --check tests/qa.mjs && \
              node tests/qa.mjs
              qa_status=$?
            else
              qa_status=99
            fi
            echo "qa_status=$qa_status"
          } 2>&1 | tee research/audits/lund-app-model-audit-run.log

      - name: Commit canonical data result
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          if grep -q '^apply_status=0$' research/audits/lund-app-model-audit-run.log && grep -q '^qa_status=0$' research/audits/lund-app-model-audit-run.log; then
            git rm -f scripts/apply_lund_app_model_audit.mjs
            git rm -f scripts/ocr_lund_catalogs.sh || true
            git rm -f scripts/build_lund_yearly_research.sh || true
            git add data/boats.js research/audits/lund-app-model-audit-2026-07-28.md research/audits/lund-app-model-audit-run.log
            message='Complete focused Lund app-model audit'
          else
            git restore data/boats.js
            rm -f research/audits/lund-app-model-audit-2026-07-28.md
            git add research/audits/lund-app-model-audit-run.log
            message='Record Lund app-model audit failure'
          fi

          git commit -m "$message"
          git pull --rebase origin main
          git push
