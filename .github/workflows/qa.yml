name: BoatBuilder QA

on:
  push:
    branches: [main]
    paths:
      - index.html
      - styles.css
      - app.js
      - data/catalog.js
      - data/lund-corrections.js
      - tests/qa.mjs
      - .github/workflows/qa.yml
  pull_request:
    branches: [main]
    paths:
      - index.html
      - styles.css
      - app.js
      - data/catalog.js
      - data/lund-corrections.js
      - tests/qa.mjs
      - .github/workflows/qa.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check data/lund-corrections.js
          node --check tests/qa.mjs

      - name: Run catalog and estimate QA
        run: node tests/qa.mjs