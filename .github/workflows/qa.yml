name: Apply Lund audit through canonical QA

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/qa.yml

permissions:
  contents: write

jobs:
  apply-lund-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Apply focused Lund app-model audit and run QA
        shell: bash
        run: |
          set +e
          mkdir -p research/audits
          {
            echo '=== APPLY AUDIT ==='
            node scripts/apply_lund_app_model_audit.mjs
            apply_status=$?
            echo "apply_status=$apply_status"
            if [ "$apply_status" -eq 0 ]; then
              echo '=== SYNTAX AND QA ==='
              node --check app.js && \
              node --check data/boats.js && \
              node --check data/equipment.js && \
              node --check data/catalog.js && \
              node --check tests/qa.mjs && \
              node tests/qa.mjs
              qa_status=$?
            else
              qa_status=99
            fi
            echo "qa_status=$qa_status"
          } 2>&1 | tee research/audits/lund-app-model-audit-run.log

      - name: Restore canonical QA workflow and commit result
        shell: bash
        run: |
          cat > .github/workflows/qa.yml <<'EOF'
          name: BoatBuilder QA

          on:
            push:
              branches: [main]
              paths:
                - index.html
                - styles.css
                - app.js
                - data/boats.js
                - data/equipment.js
                - data/catalog.js
                - tests/qa.mjs
                - .github/workflows/qa.yml
            pull_request:
              branches: [main]
              paths:
                - index.html
                - styles.css
                - app.js
                - data/boats.js
                - data/equipment.js
                - data/catalog.js
                - tests/qa.mjs
                - .github/workflows/qa.yml
            workflow_dispatch:

          permissions:
            contents: read

          jobs:
            qa:
              runs-on: ubuntu-latest
              timeout-minutes: 5
              steps:
                - name: Check out repository
                  uses: actions/checkout@v5

                - name: Set up Node
                  uses: actions/setup-node@v5
                  with:
                    node-version: "22"

                - name: Check JavaScript syntax
                  run: |
                    node --check app.js
                    node --check data/boats.js
                    node --check data/equipment.js
                    node --check data/catalog.js
                    node --check tests/qa.mjs

                - name: Run catalog and estimate QA
                  run: node tests/qa.mjs
          EOF

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          if grep -q '^apply_status=0$' research/audits/lund-app-model-audit-run.log && grep -q '^qa_status=0$' research/audits/lund-app-model-audit-run.log; then
            git rm -f scripts/apply_lund_app_model_audit.mjs .github/workflows/apply-lund-app-audit.yml
            git rm -f scripts/ocr_lund_catalogs.sh .github/workflows/lund-ocr.yml || true
            git rm -f scripts/build_lund_yearly_research.sh .github/workflows/lund-yearly-research.yml || true
            git add data/boats.js research/audits/lund-app-model-audit-2026-07-28.md research/audits/lund-app-model-audit-run.log .github/workflows/qa.yml
            message='Complete focused Lund app-model audit'
          else
            git add research/audits/lund-app-model-audit-run.log .github/workflows/qa.yml
            message='Record Lund app-model audit failure'
          fi

          git commit -m "$message"
          git pull --rebase origin main
          git push
