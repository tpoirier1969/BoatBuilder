name: BoatBuilder QA

on:
  push:
    branches: [main]
    paths:
      - index.html
      - styles.css
      - app.js
      - ui-enhancements.js
      - data/boats.js
      - data/boat-history-patches.js
      - data/equipment.js
      - data/catalog.js
      - tests/qa.mjs
      - tests/crestliner-live-integration-qa.mjs
      - .github/workflows/qa.yml
  pull_request:
    branches: [main]
    paths:
      - index.html
      - styles.css
      - app.js
      - ui-enhancements.js
      - data/boats.js
      - data/boat-history-patches.js
      - data/equipment.js
      - data/catalog.js
      - tests/qa.mjs
      - tests/crestliner-live-integration-qa.mjs
      - .github/workflows/qa.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check ui-enhancements.js
          node --check data/boats.js
          node --check data/boat-history-patches.js
          node --check data/equipment.js
          node --check data/catalog.js
          node --check tests/qa.mjs
          node --check tests/crestliner-live-integration-qa.mjs

      - name: Run canonical catalog and estimate QA
        run: node tests/qa.mjs

      - name: Run live history integration QA
        run: node tests/crestliner-live-integration-qa.mjs
