name: One-time Lund canonical roster report

on:
  push:
    paths:
      - '.github/workflows/lund-roster-report.yml'

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - run: node scripts/report_lund_roster.mjs
      - name: Commit report and remove one-time machinery
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/audits/lund-current-canonical-roster-2026-07-28.json
          git rm scripts/report_lund_roster.mjs .github/workflows/lund-roster-report.yml
          git commit -m 'Report current Lund canonical roster'
          git pull --rebase origin main
          git push
