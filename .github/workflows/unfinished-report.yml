name: Audit Smoker Craft and unfinished work

on:
  push:
    branches:
      - audit/smoker-craft-and-backlog
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply idempotent Smoker Craft repairs
        run: node scripts/audit-smoker-craft.mjs
      - name: Run catalog QA
        run: node tests/qa.mjs
      - name: Run strict Smoker Craft QA
        run: node tests/smoker-craft-qa.mjs
      - name: Generate reports
        run: node scripts/report-unfinished.mjs
      - name: Commit audited data and generated reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/boats.js reports/unfinished-work.md reports/unfinished-work.json reports/smoker-craft-current.json reports/smoker-craft-summary.md
          if git diff --cached --quiet; then
            echo "Smoker Craft data and reports are current."
            exit 0
          fi
          git commit -m "Apply verified Smoker Craft audit corrections"
          git push
