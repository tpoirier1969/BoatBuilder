name: Apply Alumacraft Dominator Navigator generations

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Apply detailed Alumacraft generations
        run: node scripts/apply_alumacraft_dominator_navigator_generations.mjs
      - name: Run QA
        run: node tests/qa.mjs
      - name: Commit canonical data and audit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/boats.js tests/qa.mjs research/alumacraft-dominator-navigator-generation-audit-2006-2012.md
          git commit -m 'Reconcile Alumacraft Dominator and Navigator generations'
          git pull --rebase origin main
          git push
