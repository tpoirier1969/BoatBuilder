name: Apply Lund app-model canonical audit

on:
  push:
    paths:
      - '.github/workflows/apply-lund-app-audit.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Apply focused Lund audit
        run: node scripts/apply_lund_app_model_audit.mjs
      - name: Check syntax and QA
        run: |
          node --check app.js
          node --check data/boats.js
          node --check data/equipment.js
          node --check data/catalog.js
          node --check tests/qa.mjs
          node tests/qa.mjs
      - name: Commit canonical Lund audit and remove one-time machinery
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/boats.js research/audits/lund-app-model-audit-2026-07-28.md
          git rm scripts/apply_lund_app_model_audit.mjs .github/workflows/apply-lund-app-audit.yml
          git commit -m 'Complete focused Lund app-model audit'
          git pull --rebase origin main
          git push
