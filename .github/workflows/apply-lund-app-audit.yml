name: Apply Lund app-model canonical audit

on:
  push:
    paths:
      - '.github/workflows/apply-lund-app-audit.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Apply audit, run QA, and capture result
        id: audit
        shell: bash
        run: |
          set +e
          mkdir -p research/audits
          {
            echo '=== APPLY AUDIT ==='
            node scripts/apply_lund_app_model_audit.mjs
            apply_status=$?
            echo "apply_status=$apply_status"
            if [ "$apply_status" -eq 0 ]; then
              echo '=== SYNTAX AND QA ==='
              node --check app.js && \
              node --check data/boats.js && \
              node --check data/equipment.js && \
              node --check data/catalog.js && \
              node --check tests/qa.mjs && \
              node tests/qa.mjs
              qa_status=$?
            else
              qa_status=99
            fi
            echo "qa_status=$qa_status"
          } 2>&1 | tee research/audits/lund-app-model-audit-run.log
          test "${PIPESTATUS[0]}" -eq 0
      - name: Commit success or diagnostic result
        if: always()
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if grep -q '^apply_status=0$' research/audits/lund-app-model-audit-run.log && grep -q '^qa_status=0$' research/audits/lund-app-model-audit-run.log; then
            git add data/boats.js research/audits/lund-app-model-audit-2026-07-28.md research/audits/lund-app-model-audit-run.log
            git rm scripts/apply_lund_app_model_audit.mjs .github/workflows/apply-lund-app-audit.yml
            message='Complete focused Lund app-model audit'
          else
            git add research/audits/lund-app-model-audit-run.log
            message='Record Lund app-model audit failure'
          fi
          git commit -m "$message"
          git pull --rebase origin main
          git push
