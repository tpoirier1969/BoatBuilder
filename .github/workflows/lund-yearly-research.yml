name: One-time all-year Lund research extraction

on:
  push:
    paths:
      - '.github/workflows/lund-yearly-research.yml'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install PDF and OCR tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils tesseract-ocr
      - name: Build yearly Lund research corpus
        run: bash scripts/build_lund_yearly_research.sh
      - name: Commit research corpus and remove one-time machinery
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/sources/lund-yearly-text research/sources/lund-target-family-index-1980-2026.tsv research/sources/lund-target-family-extracts-1980-2026.md research/sources/lund-target-family-presence-1980-2026.json
          git rm scripts/build_lund_yearly_research.sh .github/workflows/lund-yearly-research.yml
          git commit -m 'Build Lund yearly factory research corpus'
          git pull --rebase origin main
          git push
