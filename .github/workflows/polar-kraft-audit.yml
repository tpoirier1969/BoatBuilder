name: Audit Polar Kraft

on:
  push:
    branches:
      - audit/polar-kraft
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate Polar Kraft snapshot
        run: node scripts/report-polar-kraft-current.mjs
      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/polar-kraft-current.json reports/polar-kraft-current.md
          if ! git diff --cached --quiet; then
            git commit -m "Capture Polar Kraft audit snapshot"
            git push
          fi
