name: Add legacy Smoker Craft windshield families

on:
  push:
    branches:
      - add/smokercraft-legacy-windshield-families
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch current main for additive semantic comparison
        run: git fetch origin main
      - name: Add legacy Smoker Craft records when not already migrated
        run: |
          if grep -q 'boat:Smoker Craft | Stiletto 162 / 16 Stiletto LE / 165 LE listing alias' data/boats.js; then
            echo "Legacy Smoker Craft records already present; skipping one-time insertion."
          else
            node scripts/add-smokercraft-legacy-windshield-families.mjs
          fi
      - name: Update Smoker Craft QA guards
        run: node scripts/update-smokercraft-legacy-qa-counts.mjs
      - name: Regenerate catalog roster baseline
        run: node scripts/report-all-manufacturer-roster-baseline.mjs
      - name: Regenerate remaining roster-gap report
        run: node scripts/report-all-manufacturer-roster-gaps.mjs
      - name: Run canonical BoatBuilder QA
        run: node tests/qa.mjs
      - name: Run focused Smoker Craft QA
        run: node tests/smoker-craft-qa.mjs
      - name: Run legacy Smoker Craft batch QA
        run: node tests/smokercraft-legacy-windshield-families-qa.mjs
      - name: Run all-manufacturer gap QA
        run: node tests/all-manufacturer-roster-gaps-qa.mjs
      - name: Prove all existing boats are unchanged
        run: node tests/smokercraft-legacy-windshield-families-semantic-diff-qa.mjs
      - name: Write validation log
        run: |
          cat > reports/smokercraft-legacy-windshield-families-ci.log <<'LOG'
          Added seven legacy Smoker Craft dual-console/full-windshield records.
          Catalog QA passed.
          Focused Smoker Craft QA passed at 25 models and 86 non-overlapping generation/evidence rows.
          Legacy family QA passed with the 2005 165 LE listing retained as a likely Stiletto 162 match pending HIN/title/capacity plate.
          All-manufacturer roster-gap QA passed.
          Additive semantic QA passed: all 176 pre-existing boat records remained unchanged.
          smokercraft_legacy_windshield_families_status=passed
          LOG
      - name: Commit generated catalog, reports and QA updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/boats.js research/all-manufacturer-roster-gaps.json reports/all-manufacturer-roster-baseline.json reports/all-manufacturer-roster-baseline.md reports/all-manufacturer-roster-gaps.json reports/all-manufacturer-roster-gaps.md reports/smokercraft-legacy-windshield-families.json reports/smokercraft-legacy-windshield-families-ci.log tests/qa.mjs tests/smoker-craft-qa.mjs tests/smokercraft-legacy-windshield-families-qa.mjs
          if ! git diff --cached --quiet; then
            git commit -m "Apply legacy Smoker Craft windshield-family additions"
            git push
          fi
