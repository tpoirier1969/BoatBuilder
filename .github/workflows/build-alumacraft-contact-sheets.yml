name: Build Alumacraft 2006-2012 catalog contact sheets

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  sheets:
    strategy:
      fail-fast: false
      matrix:
        year: [2006, 2007, 2008, 2009, 2010, 2011, 2012]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - name: Install rendering tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils imagemagick

      - name: Render final twelve pages and build contact sheet
        shell: bash
        run: |
          set -euo pipefail
          year=${{ matrix.year }}
          yy=${year:2:2}
          if [ "$year" -le 2009 ]; then decade=2000-2009; else decade=2010-2019; fi
          url="https://www.alumacraft.com/original-content/content/dam/global/en/alumacraft/catalogs/${decade}/Catalogs/ALUMA-MY${yy}-Catalog-ENUS.pdf"
          work="/tmp/alumacraft-$year"
          mkdir -p "$work/pages" artifact
          pdf="$work/catalog.pdf"
          curl -fL --retry 3 --connect-timeout 25 --max-time 120 -A 'Mozilla/5.0' "$url" -o "$pdf"
          pages=$(pdfinfo "$pdf" | awk '/^Pages:/ {print $2}')
          first=$((pages-11)); if [ "$first" -lt 1 ]; then first=1; fi
          pdftoppm -f "$first" -l "$pages" -jpeg -scale-to 900 -jpegopt quality=80 "$pdf" "$work/pages/page" >/dev/null 2>&1
          montage "$work"/pages/*.jpg -thumbnail 850x850 -tile 3x4 -geometry +8+22 -pointsize 18 -set label '%t' "artifact/alumacraft-$year-contact.jpg"
          printf 'year\turl\tpages\tfirst_rendered_page\n%s\t%s\t%s\t%s\n' "$year" "$url" "$pages" "$first" > "artifact/alumacraft-$year.tsv"

      - uses: actions/upload-artifact@v4
        with:
          name: alumacraft-contact-${{ matrix.year }}
          path: artifact
          retention-days: 1

  merge:
    needs: sheets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          pattern: alumacraft-contact-*
          path: artifacts
          merge-multiple: true

      - name: Commit contact sheets
        run: |
          mkdir -p research/sources/alumacraft-contact-sheets
          cp artifacts/*.jpg research/sources/alumacraft-contact-sheets/
          head -n 1 artifacts/alumacraft-2006.tsv > research/sources/alumacraft-contact-sheets/manifest.tsv
          for year in 2006 2007 2008 2009 2010 2011 2012; do tail -n 1 "artifacts/alumacraft-$year.tsv"; done >> research/sources/alumacraft-contact-sheets/manifest.tsv
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/sources/alumacraft-contact-sheets
          git commit -m 'Build Alumacraft catalog contact sheets'
          git pull --rebase origin main
          git push
