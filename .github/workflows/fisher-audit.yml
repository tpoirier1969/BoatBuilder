name: Audit Fisher

on:
  push:
    branches:
      - audit/fisher
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run Fisher repair and validation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          : > reports/fisher-ci.log
          node scripts/audit-fisher.mjs | tee -a reports/fisher-ci.log
          node tests/qa.mjs | tee -a reports/fisher-ci.log
          node tests/fisher-qa.mjs | tee -a reports/fisher-ci.log
          node tests/fisher-semantic-diff-qa.mjs | tee -a reports/fisher-ci.log
          node scripts/report-unfinished.mjs | tee -a reports/fisher-ci.log
          node scripts/report-fisher-current.mjs | tee -a reports/fisher-ci.log
          echo "fisher_audit_status=passed" | tee -a reports/fisher-ci.log
      - name: Commit verified Fisher results
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/boats.js reports/fisher-current.json reports/fisher-current.md reports/fisher-ci.log reports/unfinished-work.json reports/unfinished-work.md
          if ! git diff --cached --quiet; then
            git commit -m "Apply verified Fisher audit corrections"
            git push
          fi
