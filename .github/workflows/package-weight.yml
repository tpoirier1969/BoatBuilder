name: Build package weight model

on:
  push:
    branches:
      - feature/package-weight
  workflow_dispatch:

permissions:
  contents: write

jobs:
  weight-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply package-weight upgrade and validate
        shell: bash
        run: |
          set -euo pipefail
          node scripts/apply-package-weight-ui.mjs
          node scripts/report-weight-coverage.mjs
          node scripts/report-equipment-weight-scope.mjs
          node --check weight-model.js
          node --check app.js
          node tests/qa.mjs
          node tests/package-weight-qa.mjs
      - name: Commit verified package-weight upgrade
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js index.html styles.css weight-model.js reports/weight-coverage.json reports/weight-coverage.md reports/equipment-weight-scope.json reports/equipment-weight-scope.md
          if ! git diff --cached --quiet; then
            git commit -m "Apply verified package-weight estimator upgrade"
            git push
          fi
